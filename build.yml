name: Build TwinFET

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DTWINFET_BUILD_TESTS=ON
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DTWINFET_BUILD_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP self-test
        shell: bash
        run: |
          mkdir -p results
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/Release/twinfet_measure.exe robust results
          else
            ./build/twinfet_measure robust results
          fi
          cat results/robust.csv

      - name: Collect plugin files
        shell: bash
        run: |
          mkdir -p dist
          ART=build/TwinFET_artefacts/Release
          cp -R "$ART/VST3/TwinFET.vst3" dist/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "$ART/AU/TwinFET.component" dist/
            cp -R "$ART/Standalone/TwinFET.app" dist/
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cp "$ART/Standalone/TwinFET.exe" dist/
          else
            cp "$ART/Standalone/TwinFET" dist/
          fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: TwinFET-${{ matrix.name }}
          path: dist
